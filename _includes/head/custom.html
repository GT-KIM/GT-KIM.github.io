<!-- start custom head snippets -->

<!-- favicons -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16.png' | relative_url }}">
<link rel="alternate icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- MathJax for math rendering (enable per-post with `use_math: true`) -->
{% if page.use_math %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}

<!-- Language tabs (English / 한국어): make them inviting, button-like -->
<style>
  .greedy-nav .visible-links .masthead__menu-item a,
  .greedy-nav .hidden-links .masthead__menu-item a {
    display: inline-block;
    margin: 0 .2em;
    padding: .28em 1.05em;
    border: 1.5px solid #1e40af;
    border-radius: 2em;
    color: #1e40af;
    font-weight: 700;
    line-height: 1.5;
    transition: background-color .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  .greedy-nav .visible-links .masthead__menu-item a:before,
  .greedy-nav .hidden-links .masthead__menu-item a:before { display: none; }
  .greedy-nav .masthead__menu-item a i { margin-right: .4em; }
  .greedy-nav .visible-links .masthead__menu-item a:hover,
  .greedy-nav .visible-links .masthead__menu-item a:focus,
  .greedy-nav .hidden-links .masthead__menu-item a:hover {
    background-color: #1e40af;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(30, 64, 175, .28);
  }

  /* Per-post language switcher — same pill language as the masthead tabs */
  .page__lang-switch { margin: 0 0 1.2em; }
  .page__lang-switch a {
    display: inline-block;
    padding: .28em 1.05em;
    border: 1.5px solid #1e40af;
    border-radius: 2em;
    color: #1e40af;
    font-weight: 600;
    font-size: .8em;
    text-decoration: none;
    transition: background-color .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease;
  }
  .page__lang-switch a i { margin-right: .4em; }
  .page__lang-switch a:hover {
    background-color: #1e40af;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(30, 64, 175, .28);
  }

  /* Consistent brand accent under titles on content/list pages (not heroes) */
  #main .page__title,
  #main .archive__subtitle {
    border-bottom: 3px solid #1e40af;
    padding-bottom: .3em;
  }
</style>

<!-- end custom head snippets -->
